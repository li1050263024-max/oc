name: Deploy admin Pages

on:
  push:
    branches: [master]
    paths:
      - 'cloudhosting/cloud-admin/**'
      - 'docs/**'
      - '.github/workflows/deploy-admin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/js
          cp cloudhosting/cloud-admin/index.html _site/index.html
          cp cloudhosting/cloud-admin/js/cloudbase.full.js _site/js/cloudbase.full.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
